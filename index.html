<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020816">
  <title>PS5 Creator</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Tela de inicialização -->
  <section id="splash" class="screen">
    <div class="glow"></div>
    <img src="assets/logo.svg" alt="PS5 Creator" class="splash-logo">
    <h1 class="splash-title">PS5 <span>Creator</span></h1>
    <p class="splash-sub">Crie, jogue e compartilhe</p>
    <div class="loader"><div id="loader-bar"></div></div>
    <p id="loader-text" class="loader-text">Iniciando...</p>
  </section>

  <!-- Tela inicial de autenticação -->
  <section id="auth" class="screen">
    <div class="glow"></div>
    <img src="assets/logo.svg" alt="" class="auth-logo">
    <h2>Bem-vindo</h2>
    <button class="btn primary" data-go="criar">Criar uma conta</button>
    <button class="btn ghost" data-go="entrar">Entrar em uma conta</button>
  </section>

  <!-- Criar conta -->
  <section id="criar" class="screen">
    <div class="glow"></div>
    <img src="assets/logo.svg" alt="" class="auth-logo">
    <h2>Criar Conta</h2>
    <input class="field" id="c-user" placeholder="Seu nome" maxlength="20" autocomplete="username">
    <div class="pass">
      <input class="field" id="c-pass" type="password" placeholder="Criar senha (10 a 30)" maxlength="30">
      <button type="button" class="eye" data-target="c-pass">👁</button>
    </div>
    <p class="note" id="c-msg">A senha deve ter entre 10 e 30 caracteres.</p>
    <button class="btn primary" id="c-go">Continuar</button>
    <button class="btn ghost" data-back>Voltar</button>
  </section>

  <!-- Entrar em conta -->
  <section id="entrar" class="screen">
    <div class="glow"></div>
    <img src="assets/logo.svg" alt="" class="auth-logo">
    <h2>Entrar em Conta</h2>
    <div class="pass">
      <input class="field" id="e-user" placeholder="Nome da conta" autocomplete="username">
      <button type="button" class="eye" id="e-search">🔍</button>
    </div>
    <div class="pass">
      <input class="field" id="e-pass" type="password" placeholder="Senha" maxlength="30">
      <button type="button" class="eye" data-target="e-pass">👁</button>
    </div>
    <p class="note" id="e-msg"></p>
    <button class="btn primary" id="e-go">Entrar</button>
    <button class="btn ghost" data-back>Voltar</button>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
